<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Braincase</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Rubik:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0613;--card:#1a0f2b;--line:#33214f;--acc:#ff7a00;--acc2:#a855ff;--text:#f4ecff;--muted:#9886b8;--red:#ff4466;--green:#39ffb0;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(900px 420px at 50% -8%,#3b1168 0,var(--bg) 62%) fixed;color:var(--text);font:400 15px/1.45 Rubik,system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1,h2{font-family:Unbounded,system-ui,sans-serif;font-weight:800}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;position:sticky;top:0;z-index:5;background:#0b0613e8;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-size:20px;letter-spacing:.06em;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.bal{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 5px 5px 14px;font-weight:600}
.bal button{background:var(--acc);color:#2a1200;border:0;border-radius:50%;width:28px;height:28px;font-size:18px;font-weight:700;cursor:pointer}
.app-layout{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:276px;display:flex;flex-direction:column;gap:10px;padding:14px 10px max(12px,env(safe-area-inset-bottom,0));background:#20172a;border-right:1px solid #4a3657;z-index:30}
.side-user,.side-balance{display:flex;align-items:center;gap:12px;background:#271e31;border:1px solid #43354d;border-radius:13px;padding:10px}
.side-avatar{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:12px;background:linear-gradient(135deg,#ffc06b,#ff8a36);color:#fff;font:800 18px Unbounded,sans-serif}
.side-user small{display:block;color:#b8a8c5;font-size:10px}.side-user b{display:block;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.side-balance{justify-content:center;font-size:14px;font-weight:700;padding:9px}
.side-nav{display:flex;flex-direction:column;gap:5px;flex:1;margin-top:3px}
.side-nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:43px;padding:9px 12px;border:1px solid transparent;border-radius:10px;background:transparent;color:#b8a8c5;text-align:left;font:600 12px Rubik,sans-serif;cursor:pointer}
.side-nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-nav button:hover{background:#ffffff0a;color:#f4ecff}
.side-nav button.on{background:#38283e;border-color:#a97347;box-shadow:inset 0 -2px #ff9a3d;color:#ffc481}
.side-nav .profile-link{margin-top:auto}
.workspace{min-height:100vh;margin-left:276px}
main{max-width:760px;margin:0 auto;padding:18px}
#menuToggle{display:none;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:20px;cursor:pointer}
#navScrim{display:none}
.view{display:none}.view.on{display:block}
h2.t{font-size:18px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.case{background:linear-gradient(160deg,#241240,var(--card));border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;cursor:pointer;min-height:168px}
.case:hover{border-color:var(--acc)}
.case.wide{grid-column:1/-1;min-height:auto;flex-direction:row;gap:14px;text-align:left}
.case .art{font-size:48px;line-height:1;filter:drop-shadow(0 6px 16px var(--g,#ff7a0088))}
.case .art img{max-width:100%;max-height:90px;object-fit:contain}
.case.wide .art img{max-height:120px}
.case b{font-family:Unbounded,sans-serif;font-size:13px;display:block}
.case small{color:var(--muted);display:block;font-size:12px}
.tag{display:inline-block;background:#0000004d;border-radius:999px;padding:3px 10px;font-weight:600;color:var(--acc);margin-top:4px;font-size:13px}
.tag.free{color:var(--green)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;background:#ffffff10;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 14px;font:600 13px Rubik,sans-serif;cursor:pointer;white-space:nowrap}
.cat.on{background:linear-gradient(135deg,#ff7a00,#ff3d00);border-color:transparent;color:#fff}
.grid .cc{position:relative;min-height:236px;padding:16px 10px 12px;justify-content:space-between;gap:0;background:radial-gradient(120% 80% at 50% 40%,color-mix(in srgb,var(--g) 34%,transparent),transparent 70%),linear-gradient(180deg,#1c0f2e,#120a1f);border-color:color-mix(in srgb,var(--g) 50%,#2a1840);border-radius:22px;overflow:visible}
.cc::before{content:"🕸️";position:absolute;left:8px;top:6px;font-size:22px;opacity:.28;pointer-events:none}
.cc.water::before{content:"🫧"}
.cc .cname{font-family:Unbounded,sans-serif;font-size:12.5px;letter-spacing:.02em;text-transform:uppercase;margin-top:10px;text-shadow:0 2px 10px #000}
.cc .art{font-size:84px;margin:6px 0 2px;filter:drop-shadow(0 10px 22px var(--g))}
.cc .badge{position:absolute;right:-6px;top:-10px;background:linear-gradient(135deg,#ff8a00,#ff4d00);color:#fff;font:800 12px Unbounded,sans-serif;padding:5px 10px;border-radius:12px 12px 4px 12px;box-shadow:0 4px 14px #ff6a0066;transform:rotate(4deg)}
.cc .pill{position:relative;margin-top:-14px;background:#1a0f2bf2;border:1.5px solid var(--acc);color:#ffd9a8;font:600 12px Rubik,sans-serif;padding:4px 12px;border-radius:999px;box-shadow:0 4px 14px #0008}
.cc .cfoot{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:12px;padding:0 4px;font-size:11.5px;color:var(--muted)}
.cc .cprice{display:flex;align-items:center;gap:5px;font:600 15px Rubik,sans-serif;color:#fff}
.cb{display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(135deg,#2a1450,#1a0f2b);border:1px solid #4a2a7a;border-radius:16px;padding:10px 12px;margin-bottom:12px}
.cb b{font-size:14px}.cb small{display:block;color:var(--muted);font-size:11.5px}
.cb button{background:var(--green);color:#052;border:0;border-radius:12px;padding:9px 12px;font:600 13px Rubik,sans-serif;cursor:pointer}.cb button:disabled{background:#ffffff18;color:var(--muted);cursor:default}
.drops2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.dr{display:flex;flex-direction:column;gap:3px;min-width:0}.dr .it{flex:none;width:100%;min-width:0}
.dr .ch{text-align:center;font-size:11px;color:var(--muted)}
.rtpbox{margin-top:10px;font-size:12.5px;color:var(--muted);text-align:center}
.gcard{background:linear-gradient(160deg,#241240,var(--card));border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px;cursor:pointer}
.gcard:hover{border-color:var(--acc)}
.gcard b{font-family:Unbounded,sans-serif;font-size:16px;display:block}
.game-title{display:flex!important;align-items:center;gap:11px}
.game-icon{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#ff7a0033,#a855ff44);border:1px solid #a855ff66;box-shadow:inset 0 0 14px #a855ff22,0 5px 16px #ff7a001c}
.game-icon svg{width:25px;height:25px;filter:drop-shadow(0 0 5px #ff7a0080)}
.gcard p{color:var(--muted);font-size:13px;margin-top:4px}
.back{background:none;border:0;color:var(--acc2);font:inherit;cursor:pointer;padding:0 0 12px}
.stage{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#080410;height:150px;margin:8px 0 14px}
.stage::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--acc);box-shadow:0 0 12px var(--acc);transform:translateX(-50%);z-index:2}
.strip{display:flex;gap:8px;padding:12px 0;position:absolute;left:0;top:0;will-change:transform}
.it{flex:0 0 100px;height:126px;border-radius:12px;background:var(--card);border-bottom:4px solid var(--rc,#9aa0b4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:4px}
.it .pic{height:62px;display:flex;align-items:center;justify-content:center;font-size:40px}
.it img{height:62px;max-width:90px;object-fit:contain}
.it small{font-size:11px;line-height:1.1}
.row{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font:600 16px Rubik,sans-serif;cursor:pointer;background:var(--acc);color:#2a1200}
.btn.alt{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.up-actions{display:grid;gap:8px;margin:0 0 14px}
.chance-btn{background:linear-gradient(110deg,#ff7a0026,#a855ff33)!important;border:1px solid #a855ff66!important;color:var(--text)!important}
.info{color:var(--muted);font-size:13px;margin-top:12px;text-align:center}
.me{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:16px}
.ava{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font:800 24px Unbounded,sans-serif;flex:none}
.me b{font-size:18px;display:block}.me span{color:var(--muted)}
.inv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.inv .it{flex:none;width:auto;cursor:pointer}
.inv .it.on{outline:2px solid var(--acc)}
.empty{color:var(--muted);text-align:center;padding:32px 0}
.modal{position:fixed;inset:0;background:#000000b8;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;width:100%;max-width:360px;text-align:center}
.sheet h2{font-size:20px;color:var(--acc);margin-bottom:6px}
.sheet .big{height:110px;display:flex;align-items:center;justify-content:center;font-size:64px;margin:6px 0}
.sheet .big img{height:110px;max-width:100%;object-fit:contain;filter:drop-shadow(0 8px 20px #ff7a0099)}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pk button{background:#0000004d;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 0;font:600 15px Rubik,sans-serif;cursor:pointer}
.pk button.sel{border-color:var(--acc);background:#ff7a0026}
#amt,.money{width:100%;background:#0000004d;border:1px solid var(--line);border-radius:12px;color:var(--text);font:600 16px Rubik,sans-serif;padding:12px;margin-bottom:10px;text-align:center}
#amt.bad{border-color:var(--red)}
#amtErr{color:var(--red);font-size:13px;min-height:18px;margin-bottom:6px}
.crash{font:800 56px/1 Unbounded,sans-serif;text-align:center;padding:28px 0;color:var(--acc);text-shadow:0 0 24px #ff7a0066}
.crash.dead{color:var(--red)}
.dice-num{font:800 64px/1 Unbounded,sans-serif;text-align:center;padding:18px 0}
.tgts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tgts .it{flex:none;width:auto;cursor:pointer;height:110px}
.tgts .it.on{outline:2px solid var(--acc)}
#errBanner{display:none;background:#ff446622;border:1px solid var(--red);color:#ffb3c0;padding:10px 14px;border-radius:12px;margin-bottom:12px;font-size:13px}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.wheelBox{display:flex;justify-content:center;margin:6px 0 14px}
.wheel{position:relative;width:min(280px,76vw);aspect-ratio:1}
.wheel>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wzone{transition:filter .3s}
.wheel.win .wzone{filter:drop-shadow(0 0 10px var(--green))}
.wheel.lose .wtrack{stroke:#5a1530}
.needle{position:absolute;inset:0;transform:rotate(180deg);will-change:transform;pointer-events:none}
.needle svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 6px var(--acc))}
.wcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;pointer-events:none}
.wcenter b{font:800 30px/1 Unbounded,sans-serif}
.wcenter small{color:var(--muted);font-size:12px}
.wheel.win .wcenter b,.wheel.win .wcenter small{color:var(--green)}
.wheel.lose .wcenter b,.wheel.lose .wcenter small{color:var(--red)}
.upgrade-screen{max-width:420px;margin:0 auto;padding:10px 12px 18px;background-color:#100d19;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:16px 16px;border:1px solid #35263f;border-radius:10px;box-shadow:0 12px 34px #0008}
.upgrade-screen .back{display:none}.upgrade-screen h2.t{color:#ffd3b8;font-size:15px;margin-bottom:8px;text-shadow:0 0 12px #ff7a0066}
.upgrade-screen>.info{font-size:10px;margin:0 0 6px;color:#c4a8df}
.upgrade-screen .wheelBox{margin:0 auto 6px;position:relative;width:min(250px,72vw);aspect-ratio:1}
.upgrade-screen .wheel{width:100%;height:100%;border-radius:50%;padding:12px;background:linear-gradient(145deg,#241a31,#321d43 54%,#15101f);box-shadow:inset 0 0 0 2px #130e1b,inset 0 0 25px #0009,0 0 0 2px #a855ff,0 0 0 4px #261a30,0 0 12px #a855ff66}
.upgrade-screen .wheel::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid transparent;border-bottom-color:#ff7a00;border-left-color:#ff7a0099;transform:rotate(-30deg);pointer-events:none}
.upgrade-screen .wheel>svg{inset:12px;width:calc(100% - 24px);height:calc(100% - 24px)}
.upgrade-screen .wtrack{stroke:#17111f!important;stroke-width:24!important}
.upgrade-screen .wzone{stroke:#a855ff!important;stroke-width:24!important}
.upgrade-screen .wheel.win .wzone{stroke:var(--green)!important}.upgrade-screen .wheel.lose .wtrack{stroke:#5a1530!important}
.upgrade-screen .needle svg{filter:drop-shadow(0 0 5px #ffb34d)}
.upgrade-screen .needle polygon{fill:#ffbd54}
.upgrade-screen .wcenter b{font-size:clamp(23px,7vw,32px);color:#ffbd54;text-shadow:0 2px 12px #ff7a0066}
.upgrade-screen .wcenter small{color:#dfc8f4;font-size:11px}
.wheel-label{position:absolute;font-size:8px;color:#d0b8e9;text-shadow:0 1px 3px #000;z-index:2}.wheel-label.top{top:-1px;left:50%;transform:translateX(-50%)}.wheel-label.bottom{bottom:-1px;left:50%;transform:translateX(-50%)}.wheel-label.left{left:-1px;top:50%;transform:translate(-35%,-50%) rotate(-90deg)}.wheel-label.right{right:-1px;top:50%;transform:translate(35%,-50%) rotate(90deg)}
.upgrade-hat{position:absolute;top:-12px;left:8%;font-size:36px;z-index:3;transform:rotate(-18deg);filter:drop-shadow(0 2px 4px #a855ff)}
.up-slots{display:grid;grid-template-columns:1fr 28px 1fr;align-items:center;gap:8px;margin:4px 4px 7px}
.up-slot{height:78px;min-width:0;border:1px solid #9360b3;background:#21182b;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5px;color:#d8baff;font-size:10px;overflow:hidden}.up-slot .pic{height:42px;display:flex;align-items:center;justify-content:center;font-size:28px}.up-slot .pic img{max-width:42px;max-height:40px;object-fit:contain}.up-slot .item-price{font-size:9px;color:#ffbd73}
.up-slot.selected{border-color:#ff9c42;box-shadow:0 0 10px #ff7a0033;color:#fff}.up-slot .pic{font-size:26px;line-height:1.05}.up-slot img{max-width:42px;max-height:40px;object-fit:contain}.up-slot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.slot-arrow{text-align:center;font-size:23px;color:#fff;text-shadow:0 0 8px #fff8}
.upgrade-screen .up-actions{gap:7px;margin:0 4px 10px}
.upgrade-screen .chance-btn{padding:7px 10px;border-radius:4px;font-size:10px;background:#17121e!important;border:1px solid #614176!important;color:#d9b8fb!important}
.upgrade-screen .upgrade-main{border-radius:3px;background:linear-gradient(100deg,#ff7a0077,#b65a1877)!important;color:#160d19;border:1px solid #d99854;font-size:14px;letter-spacing:.04em;padding:10px;text-transform:uppercase}
.upgrade-screen .upgrade-main::after{content:"›";font-size:20px;margin-left:8px;vertical-align:-1px}
.upgrade-screen .fast-label{font-size:9px;color:#d7b7ff;text-transform:uppercase;letter-spacing:.08em;margin:6px 4px 5px}
.up-presets{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:0 4px 10px}
.up-presets button{min-width:0;padding:6px 1px;background:#211b2b;border:1px solid #46374f;color:#d8c5e8;font:600 9px Rubik,sans-serif;cursor:pointer}
.up-presets button.on{border-color:#ff9c42;color:#ffce91;background:#382538;box-shadow:0 0 8px #ff7a0044}
.pick-labels{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 6px}
.pick-labels button{background:#21182b;border:1px solid #8b5aa9;color:#e8d5f5;border-radius:7px;padding:7px 3px;font:600 9px Rubik,sans-serif;text-transform:uppercase;cursor:pointer}
.upgrade-screen #upSrc,.upgrade-screen #upTgt{display:none;margin:8px 0;padding:8px;background:#18131f;border:1px solid #44314f;border-radius:8px}
.upgrade-screen #upSrc.open{display:block}.upgrade-screen #upTgt.open{display:grid}
.upgrade-screen #upSrc .inv,.upgrade-screen #upTgt{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;max-height:220px;overflow:auto}
.upgrade-screen #upSrc .it,.upgrade-screen #upTgt .it{height:78px;min-width:0;padding:3px;background:#251b30}
.upgrade-screen #upSrc .it .pic,.upgrade-screen #upTgt .it .pic{height:42px;font-size:27px}
.upgrade-screen #upSrc .it img,.upgrade-screen #upTgt .it img{height:38px;max-width:58px}
.upgrade-screen #upSrc .it small,.upgrade-screen #upTgt .it small{font-size:8px;line-height:1.1}
.upgrade-screen #upSrc .empty,.upgrade-screen #upTgt .empty{padding:12px 0;font-size:11px}
.upgrade-screen{background-color:#130d09;background-image:linear-gradient(#ff9b3510 1px,transparent 1px),linear-gradient(90deg,#ff9b3510 1px,transparent 1px);border-color:#503019;box-shadow:0 12px 34px #0009,0 0 28px #ff7a0012}
.upgrade-screen h2.t{color:#ffe0c2;text-shadow:0 0 12px #ff7a0080}
.upgrade-screen .wheel{background:radial-gradient(circle at 50% 75%,#653b25,#29190f 67%,#17100c);box-shadow:inset 0 0 0 2px #130e0a,inset 0 0 25px #0009,0 0 0 2px #ffad4c,0 0 0 4px #2b1a10,0 0 15px #ff7a0070}
.upgrade-screen .wheel::before{border-bottom-color:#ff9d28;border-left-color:#ff7a00}
.upgrade-screen .wtrack{stroke:#1b130e!important}.upgrade-screen .wzone{stroke:#ff9a35!important}
.upgrade-screen .wcenter b{color:#ffc16f;text-shadow:0 2px 12px #ff7a0090}
.upgrade-screen .wcenter small,.upgrade-screen>.info{color:#f2c99e}
.upgrade-screen .wheel-label{color:#ffd6a7}.upgrade-screen .upgrade-hat{filter:drop-shadow(0 2px 4px #ff7a00)}
.upgrade-screen .chance-btn{background:#25170e!important;border-color:#8d4a1e!important;color:#ffca8d!important}
.upgrade-screen .upgrade-main{background:linear-gradient(100deg,#ff9a30,#ffb047)!important;border-color:#ffd194;color:#291507;box-shadow:0 0 18px #ff7a0055;font-weight:800}
.upgrade-screen .up-slot{background:#21150d;border-color:#9b5a2e;color:#ffd0a1}
.upgrade-screen .up-slot.selected{border-color:#ffab45;box-shadow:0 0 12px #ff7a0050}
.upgrade-screen .up-presets button{background:#21160f;border-color:#573a27;color:#f4d1ac}.upgrade-screen .up-presets button.on{background:#432514;border-color:#ff9a35;color:#ffd195}
.upgrade-screen .pick-labels button{background:#24170f;border-color:#a65e30;color:#ffe0c2}.upgrade-screen #upSrc,.upgrade-screen #upTgt{background:#19110c;border-color:#614027}
.it .item-price{font-size:10px;line-height:1.1;color:#ffcb8d;white-space:nowrap}
.upgrade-screen #upSrc .it .item-price,.upgrade-screen #upTgt .it .item-price{font-size:8px}
@media (max-width:760px){
  .sidebar{width:min(310px,calc(100vw - 54px));transform:translateX(-105%);transition:transform .22s ease;box-shadow:12px 0 38px #0008;padding-top:max(12px,env(safe-area-inset-top,0))}
  body.nav-open .sidebar{transform:translateX(0)}
  .workspace{margin-left:0}
  #menuToggle{display:flex;flex:none}
  header{padding:10px 12px;gap:9px}
  header .logo{font-size:16px;margin-right:auto}
  header .bal{font-size:12px;padding-left:9px;gap:5px}
  header .bal button{width:28px;height:28px}
  main{padding:14px 12px}
  #navScrim{position:fixed;inset:0;background:#0009;z-index:29}
  body.nav-open #navScrim{display:block}
}
@media (prefers-reduced-motion:reduce){.strip,.sidebar{transition:none!important}}
</style>
</head>
<body>
<div class="app-layout">
<aside class="sidebar" id="sidebar">
  <div class="side-user"><div class="side-avatar" id="sideAva">?</div><div><small>Telegram</small><b id="sideName">Игрок</b></div></div>
  <div class="side-balance">🪙 <span id="sideBal">0</span></div>
  <nav class="side-nav" aria-label="Разделы">
    <button data-go="cases" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4.4 7.7 7.6 4.4 7.6-4.4M12 12v9"/></svg><span>Кейсы</span></button>
    <button data-go="up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 2-9 12h7l-1 8 10-13h-7l.5-7Z"/></svg><span>Апгрейд</span></button>
    <button data-go="me" class="profile-link"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 3.5-6 8-6s7.2 2 8 6"/></svg><span>Профиль</span></button>
  </nav>
</aside>
<div class="workspace">
<header>
  <button id="menuToggle" aria-label="Открыть меню" aria-expanded="false">☰</button>
  <h1 class="logo">BRAINCASE</h1>
  <div class="bal"><span id="bal">0 🪙</span><button id="snd" aria-label="Звук" style="background:var(--line);color:var(--text);font-size:14px">🔊</button></div>
</header>

<main>
  <div id="errBanner"></div>
  <section class="view on" id="v-cases">
    <h2 class="t">Кейсы</h2>
    <div id="cbBox"></div>
    <div class="cats" id="cats"></div>
    <div class="grid" id="caseGrid"></div>
  </section>

  <section class="view" id="v-open">
    <button class="back" id="back">‹ Все кейсы</button>
    <h2 class="t" id="oTitle"></h2>
    <div class="stage"><div class="strip" id="strip"></div></div>
    <div id="batchBox" class="row" style="margin:12px 0"></div>
    <div class="row"><button class="btn" id="openBtn"></button></div>
    <p class="info" id="oInfo"></p>
    <div class="rtpbox" id="oRtp"></div>
    <div class="drops2" id="oDrops"></div>
  </section>
<section class="view" id="v-up">
   <div class="upgrade-screen">
    <button class="back" data-to="cases">‹ Кейсы</button>
    <h2 class="t">Апгрейд</h2>
    <p class="info">Цены в монетах 🪙. Выбери предмет и цель.</p>
    <div class="wheelBox"><div class="wheel" id="wheel">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs><linearGradient id="upgradeArc" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8a35"/><stop offset="1" stop-color="#bd79ff"/></linearGradient></defs>
        <circle class="wtrack" cx="100" cy="100" r="80" fill="none" stroke="#33214f" stroke-width="18"/>
        <circle class="wzone" id="wZone" cx="100" cy="100" r="80" fill="none" stroke="url(#upgradeArc)" stroke-width="18" stroke-dasharray="0 503" transform="rotate(-90 100 100)"/>
      </svg>
      <div class="needle" id="needle"><svg viewBox="0 0 200 200" aria-hidden="true"><polygon points="90,46 110,46 100,20" fill="#ff7a00"/></svg></div>
      <div class="wcenter"><b id="wPct">—</b><small id="wSub">Выберите предметы</small></div>
      <span class="wheel-label top">100%</span><span class="wheel-label right">50%</span><span class="wheel-label bottom">0%</span><span class="wheel-label left">50%</span><span class="upgrade-hat" aria-hidden="true">🧙</span>
    </div></div>
    <button class="btn chance-btn" id="upChance" type="button" disabled>Шанс: —</button>
    <div class="up-slots">
      <div class="up-slot" id="upSrcSlot"><span>Твой предмет</span></div><div class="slot-arrow">➜</div>
      <div class="up-slot" id="upTgtSlot"><span>Цель</span></div>
    </div>
    <div class="up-actions">
      <button class="btn upgrade-main" id="upBtn" disabled>Прокачать</button>
    </div>
    <div class="fast-label">Быстрый выбор</div>
    <div class="up-presets">
      <button type="button" data-up-preset="2">x2</button><button type="button" data-up-preset="5">x5</button><button type="button" data-up-preset="10">x10</button><button type="button" data-up-preset="30">30%</button><button type="button" data-up-preset="50">50%</button><button type="button" data-up-preset="75">75%</button>
    </div>
    <div class="pick-labels"><button type="button" id="showInv">Мои предметы</button><button type="button" id="showTargets">Желаемые предметы</button></div>
    <div id="upSrc"></div>
    <div class="tgts" id="upTgt"></div>
   </div>
  </section>

  <section class="view" id="v-me">
    <div class="me"><div class="ava" id="ava">?</div><div><b id="uname">—</b><span id="ubal"></span></div></div>
    <div id="statsBox" class="info" style="margin:0 0 18px"></div>
    <h2 class="t">Инвентарь</h2>
    <div id="invBox"></div>
  </section>
</main>
</div>
</div>
<div id="navScrim"></div>
<div class="modal" id="mWin"><div class="sheet">
  <div class="big" id="wPic"></div><h2 id="wName"></h2><div id="wVal" style="color:var(--muted)"></div>
  <div class="row" style="margin-top:14px"><button class="btn" id="wOk">Отлично</button></div>
</div></div>

<div class="modal" id="mSellAll"><div class="sheet">
  <h2>Продать инвентарь?</h2>
  <p id="sellAllText" style="color:var(--muted);margin:12px 0"></p>
  <div class="row"><button class="btn alt" id="sellAllCancel">Отмена</button><button class="btn" id="sellAllConfirm">Продать всё</button></div>
</div></div>

<script>
const API_URL = location.protocol.startsWith("http") ? location.origin : "";
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#0b0613"); tg.setBackgroundColor && tg.setBackgroundColor("#0b0613"); }
const $ = s => document.querySelector(s);
const fmt = n => Number(n).toLocaleString("ru-RU");

const FALLBACK_ITEMS = {
  coin:{name:"1 монета",e:"🪙",c:"#ffd24a",value:1},
  dragon:{name:"Dragon Cannelloni",e:"🐉",c:"#ff7a00",value:1500}
};
const S = { bal:0, inv:[], subClaimed:false, stats:{casesOpened:0,upgrades:0,coinsEarned:0}, user:{username:"",first_name:""},
  cfg:{ subReward:10, upgradeMult:0.8, items:FALLBACK_ITEMS, cases:{} } };
const item = k => (S.cfg.items && S.cfg.items[k]) || FALLBACK_ITEMS[k] || {name:k,e:"❓",c:"#9aa0b4",value:0};

async function api(path, data){
  const r = await fetch(API_URL + path, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({...data, initData: tg ? tg.initData : ""}) });
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error(j.error || "Ошибка"); return j;
}
function apply(d){
  if(!d) return;
  if(d.balance != null) S.bal = Number(d.balance) || 0;
  if(d.inv) S.inv = d.inv;
  if(d.subClaimed != null) S.subClaimed = !!d.subClaimed;
  if(d.stats) S.stats = d.stats;
  if(d.user) S.user = d.user;
  if(d.cfg) S.cfg = Object.assign({}, S.cfg, d.cfg);
  render();
}
function pic(k){
  const i = item(k);
  return i.img ? `<img src="${i.img}" alt="${i.name}" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('${i.e}'))">` : (i.e || "❓");
}
const card = k => `<div class="it" style="--rc:${item(k).c||'#9aa0b4'}"><div class="pic">${pic(k)}</div><small>${item(k).name}</small><span class="item-price" title="Цена продажи в монетах">${fmt(item(k).value)} 🪙</span></div>`;

const CATS = [["all","Все"],["halloween","🎃 Хэллоуин"],["water","🌊 Водные"],["dragon","🐉 Драконы"]];
let catFilter = "all";
const xfmt = n => String(Math.round(Number(n)*10)/10).replace(".", ",");
function renderCases(){
  const order = ["grave","deep","vamp","hound","lair","king","throne"];
  const cs = S.cfg.cases || {};
  $("#cats").innerHTML = CATS.map(([id,t])=>`<button class="cat ${id===catFilter?"on":""}" data-cat="${id}">${t}</button>`).join("");
  $("#cats").onclick = e => { const b=e.target.closest(".cat"); if(b){ catFilter=b.dataset.cat; renderCases(); } };
  $("#cbBox").innerHTML = "";
  const all = catFilter==="all";
  let html = order.filter(id=>cs[id] && (cs[id].special ? all : (all || cs[id].cat===catFilter))).map(id=>{
    const c = cs[id];
    return `<div class="case cc ${c.cat==="water"?"water":""}" data-id="${id}" style="--g:${c.g||"#ff7a00"}">
      <span class="badge">x${xfmt(c.maxX)}</span>
      <b class="cname">${c.name}</b>
      <div class="art">${c.art}</div>
      <span class="pill">RTP ${xfmt(c.rtp)}%</span>
      <div class="cfoot"><span>${c.count} предм.</span><span class="cprice">🪙 ${fmt(c.price)}</span></div></div>`;
  }).join("");
  if(all) html += `<div class="case" data-id="sub" style="--g:#39ffb0aa">
    <div class="art">📣</div>
    <div><b>CHANNEL</b><small>@braincasegg</small>
    <span class="tag free">${S.subClaimed ? "Получено ✓" : "Бесплатно · +"+S.cfg.subReward+" 🪙"}</span></div></div>`;
  if(!html) html = `<p class="info" style="grid-column:1/-1">В этой категории пока нет кейсов.</p>`;
  $("#caseGrid").innerHTML = html;
  $("#caseGrid").onclick = e => { const el=e.target.closest(".case"); if(el) openCase(el.dataset.id); };
}

function render(){
  $("#bal").textContent = fmt(S.bal) + " 🪙"; $("#ubal").textContent = "Баланс: " + fmt(S.bal) + " 🪙";
  $("#sideBal").textContent = fmt(S.bal);
  const name = S.user.username ? "@" + S.user.username : (S.user.first_name || "Игрок");
  $("#uname").textContent = name; $("#sideName").textContent = name;
  $("#ava").textContent = $("#sideAva").textContent = (name.replace("@","")[0] || "?").toUpperCase();
  $("#statsBox").innerHTML = `Кейсов открыто: <b>${fmt(S.stats.casesOpened)}</b> · Апгрейдов: <b>${fmt(S.stats.upgrades)}</b><br>Виртуальных монет заработано: <b>${fmt(S.stats.coinsEarned)} 🪙</b>`;
  if($("#v-cases").classList.contains("on")) renderCases();
  const box = $("#invBox");
  box.innerHTML = S.inv.length
    ? `<div class="row" style="margin:0 0 10px"><button class="btn red" id="sellAllBtn">Продать всё</button></div><div class="inv">${S.inv.map((k,i)=>card(k).replace('class="it"',`class="it" data-i="${i}"`)).join("")}</div><p class="info">Нажмите предмет, чтобы продать его отдельно</p>`
    : '<div class="empty">Пока пусто. Откройте первый кейс.</div>';
  if($("#v-up").classList.contains("on")) renderUp();
}

let AC, muted=false; try{ muted=localStorage.getItem("mute")==="1"; }catch(e){}
function unlock(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){} }
function tone(f,t,d,type="sine",v=.12,f2){ if(muted||!AC) return; try{ const s=AC.currentTime+t,o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,s); if(f2) o.frequency.exponentialRampToValueAtTime(f2,s+d); g.gain.setValueAtTime(v,s); g.gain.exponentialRampToValueAtTime(.001,s+d); o.connect(g); g.connect(AC.destination); o.start(s); o.stop(s+d+.02); }catch(e){} }
function sndSpin(ms,n=36,rise=false){ for(let i=1;i<=n;i++) tone(rise?420+i*20:720,(1-Math.pow(1-i/n,1/3))*ms/1000,.04,"square",.05); }
const sndWin=big=>{ [523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.25,"triangle",.14)); if(big) [1047,1319,1568].forEach((f,i)=>tone(f,.4+i*.09,.4,"triangle",.14)); };
const sndFail=()=>tone(300,0,.4,"sawtooth",.1,80);
const setSnd=()=>{ $("#snd").textContent = muted?"🔇":"🔊"; };
$("#snd").onclick=()=>{ muted=!muted; try{ localStorage.setItem("mute",muted?"1":"0"); }catch(e){} setSnd(); unlock(); };
setSnd();
let ready=false, lockSync=false;
async function sync(){
  if(!API_URL || lockSync) return;
  try{
    const prev=S.bal;
    apply(await api("/api/me", {}));
    $("#errBanner").style.display="none";
    if(ready && S.bal!==prev && tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(S.bal>prev?"success":"warning");
    ready=true;
  }catch(e){
    $("#errBanner").style.display="block";
    $("#errBanner").textContent = e.message || "Нет связи с сервером. Открой Mini App из бота.";
  }
}
setInterval(sync, 2500);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) sync(); });

function show(v){
  document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on", x.id==="v-"+v));
  const activeView = v==="open" ? "cases" : v;
  document.querySelectorAll(".side-nav [data-go]").forEach(b=>{
    const on = b.dataset.go===activeView;
    b.classList.toggle("on", on);
  });
  if(tg) (v==="open"||v==="up") ? tg.BackButton.show() : tg.BackButton.hide();
  if(v==="cases") renderCases();
  if(v==="up"){
    if(upI>=S.inv.length){ upI=-1; upT=""; }
    renderUp();
    if(upI<0){ $("#upSrc").classList.add("open"); $("#upTgt").classList.remove("open"); }
    else { $("#upTgt").classList.add("open"); }
  }
}
const closeNav=()=>{ document.body.classList.remove("nav-open"); $("#menuToggle").setAttribute("aria-expanded","false"); };
document.querySelectorAll(".side-nav [data-go]").forEach(b=>b.onclick=()=>{ show(b.dataset.go); closeNav(); });
$("#menuToggle").onclick=()=>{ const open=document.body.classList.toggle("nav-open"); $("#menuToggle").setAttribute("aria-expanded",String(open)); };
$("#navScrim").onclick=closeNav;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeNav(); });
$("#back").onclick = () => show("cases");
document.querySelectorAll("[data-to]").forEach(b=>b.onclick=()=>show(b.dataset.to));
if(tg) tg.BackButton.onClick(()=>{
  if($("#v-open").classList.contains("on")) show("cases");
  else show("cases");
});

$("#invBox").onclick = async e => {
  if(e.target.closest("#sellAllBtn")) { openSellAllConfirm(); return; }
  const el = e.target.closest(".it"); if(!el) return;
  const k = S.inv[+el.dataset.i]; if(!item(k)) return;
  if(!confirm(`Продать ${item(k).name} за ${fmt(item(k).value)} виртуальных 🪙?`)) return;
  try{ apply(await api("/api/sell", {index:+el.dataset.i})); }catch(err){ alert(err.message); }
};

let cur=null, spinning=false, batchCount=1;
function openCase(id){
  cur = id;
  const strip = $("#strip"); strip.style.transition="none"; strip.style.transform="translateX(0)";
  const c = (S.cfg.cases||{})[id];
  batchCount=1;
  $("#batchBox").innerHTML = id==="sub" ? "" : [1,2,3,4,5].map(n=>`<button class="btn alt batch-choice ${n===1?"on":""}" data-count="${n}" style="padding:8px 12px">${n}</button>`).join("");
  $("#batchBox").onclick = e => { const b=e.target.closest("[data-count]"); if(!b) return; batchCount=Number(b.dataset.count); $("#batchBox").querySelectorAll("[data-count]").forEach(x=>x.classList.toggle("on",x===b)); updateOpenButton(); };
  if(id==="sub"){
    $("#oTitle").textContent = "CHANNEL CASE";
    $("#openBtn").textContent = S.subClaimed ? "Уже получено" : "Подписался, проверить";
    $("#openBtn").disabled = S.subClaimed;
    $("#oInfo").innerHTML = `Сначала подпишитесь: <a href="https://t.me/braincasegg" style="color:var(--acc2)" id="chLink">t.me/braincasegg</a>`;
    strip.innerHTML = Array(8).fill(card("coin")).join("");
    const ch=$("#chLink"); if(ch) ch.onclick = e => { if(tg){ e.preventDefault(); tg.openTelegramLink("https://t.me/braincasegg"); } };
  } else {
    $("#oTitle").textContent = (c && c.name) || id.toUpperCase();
    updateOpenButton();
    $("#openBtn").disabled = false;
    const pool = (c && c.pool) || ["dragon"];
    $("#oInfo").textContent = "Все награды виртуальные и поступают в коллекцию.";
    strip.innerHTML = Array(10).fill(0).map((_,i)=>card(pool[i%pool.length])).join("");
    if(c && c.chances){
      $("#oRtp").textContent = `RTP ${xfmt(c.rtp)}%: в среднем игрокам возвращается ${xfmt(c.rtp)}% от цены кейса. Самый дешёвый приз стоит 1/3 цены, самый дорогой — до x${xfmt(c.maxX)}.`;
      $("#oDrops").innerHTML = Object.entries(c.chances).sort((a,b)=>item(b[0]).value-item(a[0]).value).map(([k,p])=>`<div class="dr">${card(k)}<span class="ch">${String(p).replace(".", ",")}%</span></div>`).join("");
    } else { $("#oRtp").textContent=""; $("#oDrops").innerHTML=""; }
  }
  if(id==="sub"){ $("#oRtp").textContent=""; $("#oDrops").innerHTML=""; }
  show("open");
}
function updateOpenButton(){ const c=(S.cfg.cases||{})[cur]; const total=(c?.price||0)*batchCount; $("#openBtn").textContent=`Открыть ${batchCount} за ${fmt(total)} 🪙`; }
$("#openBtn").onclick = async () => {
  if(spinning) return;
  unlock();
  const price = cur==="sub" ? 0 : (((S.cfg.cases||{})[cur]||{}).price || 0) * batchCount;
  if(cur!=="sub" && S.bal < price){ alert("Недостаточно виртуальных монет"); return; }
  spinning = true; $("#openBtn").disabled = true;
  try{
    const r = await api("/api/open", {case:cur, count:batchCount});
    const wins=r.wins||[r.win];
    if(cur!=="sub") await animate(wins[wins.length-1]);
    apply(r); if(cur==="sub") S.subClaimed = true; render();
    if(wins.length>1){ $("#wPic").innerHTML=`<div class="inv">${wins.map(k=>card(k)).join("")}</div>`; $("#wName").textContent=`Получено предметов: ${wins.length}`; $("#wVal").textContent="Добавлены в виртуальную коллекцию"; $("#mWin").classList.add("on"); sndWin(false); }
    else showWin(cur==="sub"?r:{...r,win:wins[0]});
  }catch(err){ alert(err.message); }
  finally{ spinning=false; $("#openBtn").disabled = (cur==="sub" && S.subClaimed); }
};
function animate(win){
  return new Promise(res=>{
    const N=40, STOP=34, strip=$("#strip"), stage=$(".stage");
    const pool = ((S.cfg.cases||{})[cur]||{}).pool || ["dragon","coin"];
    const seq = Array.from({length:N},(_,i)=> i===STOP ? win : pool[i%pool.length]);
    strip.style.transition="none"; strip.style.transform="translateX(0)"; strip.innerHTML = seq.map(card).join("");
    sndSpin(4200,34);
    const target = STOP*108 + 54 - stage.clientWidth/2 + (Math.random()-.5)*60;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ strip.style.transition="transform 4.2s cubic-bezier(.12,.7,.1,1)"; strip.style.transform=`translateX(${-target}px)`; }));
    setTimeout(res, 4400);
  });
}
function showWin(r,silent){
  const k = r.win==="coins" || r.win==="coin" ? "coin" : r.win;
  $("#wPic").innerHTML = pic(k);
  if(r.win==="coins") $("#wName").textContent = `+${r.amount} монет`;
  else if(r.win==="coin") $("#wName").textContent = "+1 монета";
  else if(r.ok===false) $("#wName").textContent = "Неудача";
  else if(r.ok) $("#wName").textContent = item(r.win).name + "!";
  else $("#wName").textContent = (item(r.win).name || r.win) + "!";
  $("#wVal").textContent = r.win==="coin"||r.win==="coins" ? "Зачислено на баланс" : (ITEMS_SELL(r.win));
  $("#mWin").classList.add("on");
  const bad = r.win==="coin"||r.ok===false;
  if(!silent){ bad ? sndFail() : sndWin(item(r.win).value>=1000); }
  if(tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(bad?"warning":"success");
}
function ITEMS_SELL(k){ const i=item(k); return i.value ? `${fmt(i.value)} 🪙 · продать за ${fmt(i.value)} 🪙` : ""; }
$("#wOk").onclick = () => $("#mWin").classList.remove("on");

let upI=-1, upT="", upSpin=false, needleAng=180;
const WC = 2*Math.PI*80;
function setWheel(c){
  const z=$("#wZone");
  if(c==null){ z.setAttribute("stroke-dasharray",`0 ${WC}`); z.setAttribute("transform","rotate(-90 100 100)"); $("#wPct").textContent="—"; return; }
  z.setAttribute("stroke-dasharray",`${c*WC} ${WC}`);
  z.setAttribute("transform",`rotate(${-90-c*180} 100 100)`); // зона по центру сверху
  $("#wPct").textContent=(c*100).toFixed(1)+"%";
}
function renderUp(){
  if(upSpin) return;
  const srcSlot=$("#upSrcSlot"), tgtSlot=$("#upTgtSlot");
  if(srcSlot){
    const k=S.inv[upI];
    srcSlot.classList.toggle("selected",!!k);
    srcSlot.innerHTML=k?`<div class="pic">${pic(k)}</div><span>${item(k).name}</span><small class="item-price">${fmt(item(k).value)} 🪙</small>`:"<span>Твой предмет</span>";
    tgtSlot.classList.toggle("selected",!!upT);
    tgtSlot.innerHTML=upT?`<div class="pic">${pic(upT)}</div><span>${item(upT).name}</span><small class="item-price">${fmt(item(upT).value)} 🪙</small>`:"<span>Цель</span>";
  }
  const src = $("#upSrc");
  src.innerHTML = S.inv.length
    ? `<div class="inv">${S.inv.map((k,i)=>card(k).replace('class="it"',`class="it ${upI===i?"on":""}" data-i="${i}"`)).join("")}</div>`
    : '<div class="empty">Нет предметов для апгрейда</div>';
    src.onclick = e => { if(upSpin) return; const el=e.target.closest(".it"); if(!el) return; upI=+el.dataset.i; upT=""; src.classList.remove("open"); $("#upTgt").classList.add("open"); renderUp(); };
  const keys = Object.keys(S.cfg.items||{}).filter(k=>k!=="coin");
  const srcVal = S.inv[upI] ? item(S.inv[upI]).value : 0;
  $("#upTgt").innerHTML = keys.filter(k=>item(k).value>srcVal).map(k=>
    card(k).replace('class="it"',`class="it ${upT===k?"on":""}" data-k="${k}"`)
  ).join("") || '<div class="empty" style="grid-column:1/-1">Выберите предмет</div>';
  $("#upTgt").onclick = e => { if(upSpin) return; const el=e.target.closest("[data-k]"); if(!el) return; upT=el.dataset.k; renderUp(); };
  let c=null;
  if(upI>=0 && upT) c = Math.min(0.9, Math.max(0.01, (item(S.inv[upI]).value / item(upT).value) * (S.cfg.upgradeMult||0.8)));
  $("#upChance").textContent = "Шанс: "+(c==null?"—":(c*100).toFixed(1)+"%");
  $("#wheel").classList.remove("win","lose");
  $("#wSub").textContent = c==null ? "Выберите предметы" : "Шанс апгрейда";
  setWheel(c);
  $("#upChance").disabled = c==null;
  $("#upBtn").disabled = !(upI>=0 && upT);
}
$("#upSrcSlot").onclick=()=>{ $("#upSrc").classList.add("open"); $("#upTgt").classList.remove("open"); };
$("#upTgtSlot").onclick=()=>{ $("#upTgt").classList.add("open"); $("#upSrc").classList.remove("open"); };
$("#showInv").onclick=()=>{ $("#upSrc").classList.toggle("open"); $("#upTgt").classList.remove("open"); };
$("#showTargets").onclick=()=>{ $("#upTgt").classList.toggle("open"); $("#upSrc").classList.remove("open"); };
document.querySelectorAll("[data-up-preset]").forEach(b=>b.onclick=()=>{
  if(upI<0 || upSpin) return;
  const v=Number(b.dataset.upPreset), source=item(S.inv[upI]).value;
  const wanted=v<11 ? source*v : source*(S.cfg.upgradeMult||0.8)/(v/100);
  const keys=Object.keys(S.cfg.items||{}).filter(k=>k!=="coin"&&item(k).value>source);
  keys.sort((a,b)=>Math.abs(Math.log(item(a).value/wanted))-Math.abs(Math.log(item(b).value/wanted)));
  if(keys.length){ upT=keys[0]; renderUp(); document.querySelectorAll("[data-up-preset]").forEach(x=>x.classList.toggle("on",x===b)); }
});
function spinNeedle(roll,c){
  return new Promise(res=>{
    const n=$("#needle");
    const target=(((roll-c/2)*360)%360+360)%360;   // 0° = верх, зона: ±c·180°
    const cur=((needleAng%360)+360)%360;
    needleAng += ((target-cur+360)%360) + 360*5;   // всегда вперёд, 5 полных оборотов
    const dur = matchMedia("(prefers-reduced-motion:reduce)").matches ? 600 : 4800;
    sndSpin(dur,40,true);
    n.style.transition=`transform ${dur}ms cubic-bezier(.15,.65,.08,1)`;
    n.style.transform=`rotate(${needleAng}deg)`;
    setTimeout(res, dur+150);
  });
}
$("#upBtn").onclick = async () => {
  if(upSpin) return;
  unlock(); upSpin = true; lockSync = true; $("#upBtn").disabled = true;
  const wheel = $("#wheel"); wheel.classList.remove("win","lose");
  let r=null;
  try{
    r = await api("/api/upgrade", {index:upI, target:upT});
    const c = r.chance;
    setWheel(c); $("#wSub").textContent = "Крутим…";
    const roll = typeof r.roll==="number" ? r.roll : (r.ok ? Math.random()*c : c+Math.random()*(1-c));
    await spinNeedle(roll, c);
    wheel.classList.add(r.ok ? "win" : "lose");
    $("#wSub").textContent = r.ok ? "УСПЕХ" : "НЕУДАЧА";
    r.ok ? sndWin(true) : sndFail();
    if(tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(r.ok?"success":"error");
    await new Promise(x=>setTimeout(x,900));
  }catch(e){ alert(e.message); r=null; }
  finally{ upSpin=false; lockSync=false; }
  if(r){
    apply(r); upI=-1; upT=""; renderUp();
    showWin({ win: r.ok ? r.win : "coin", ok: r.ok }, true);
    if(!r.ok){ $("#wName").textContent="Предмет сгорел"; $("#wVal").textContent="Апгрейд не удался"; $("#wPic").textContent="💥"; }
  }
  $("#upBtn").disabled = !(upI>=0 && upT);
};

function openSellAllConfirm(){
  if(!S.inv.length) return;
  const total=S.inv.reduce((sum,k)=>sum+(item(k).value||0),0);
  $("#sellAllText").textContent=`Будет продано ${S.inv.length} предметов за ${fmt(total)} виртуальных 🪙. Это действие нельзя отменить.`;
  $("#mSellAll").classList.add("on");
}
$("#sellAllCancel").onclick=()=>$("#mSellAll").classList.remove("on");
$("#sellAllConfirm").onclick=async()=>{
  $("#sellAllConfirm").disabled=true;
  try{ const r=await api("/api/sell-all",{}); apply(r); $("#mSellAll").classList.remove("on"); }
  catch(e){ alert(e.message); }
  finally{ $("#sellAllConfirm").disabled=false; }
};

renderCases(); render(); sync();
</script>
</body>
</html>
